x-motrix-next-base: &motrix-next-base
  restart: unless-stopped
  networks:
    - vos_default
  environment:
    PORT: "47000"
    DOWNLOAD_DIR: /downloads
    VOS_APP_VERSION: "__APP_VERSION__"
  volumes:
    - ${MOTRIX_DOWNLOADS_PATH:-/data/vos_workspace/motrix/downloads}:/downloads
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-motrix-next}-top-open.rule=PathPrefix(`/app/com.ictrek.motrix-next`) && HeadersRegexp(`Sec-Fetch-Dest`, `document`)"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-motrix-next}-top-open.priority=1000"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-motrix-next}-top-open.service=${COMPOSE_PROJECT_NAME:-motrix-next}-web"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-motrix-next}-top-open.middlewares=${COMPOSE_PROJECT_NAME:-motrix-next}-top-open-redirect"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-motrix-next}-top-open-redirect.redirectregex.regex=^(https?://[^/]+)/app/com\\.ictrek\\.motrix-next/?(?:\\?.*)?$"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-motrix-next}-top-open-redirect.redirectregex.replacement=$${1}/#/app/com.ictrek.motrix-next/com-ictrek-motrix-next/downloads"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-motrix-next}-top-open-redirect.redirectregex.permanent=false"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-motrix-next}-web.rule=PathPrefix(`/app/com.ictrek.motrix-next`)"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-motrix-next}-web.service=${COMPOSE_PROJECT_NAME:-motrix-next}-web"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-motrix-next}-web.middlewares=${COMPOSE_PROJECT_NAME:-motrix-next}-web-slash,${COMPOSE_PROJECT_NAME:-motrix-next}-web-strip"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-motrix-next}-web-slash.redirectregex.regex=^(.*)/app/com\\.ictrek\\.motrix-next$"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-motrix-next}-web-slash.redirectregex.replacement=$${1}/app/com.ictrek.motrix-next/"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-motrix-next}-web-slash.redirectregex.permanent=true"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-motrix-next}-web-strip.stripprefix.prefixes=/app/com.ictrek.motrix-next"
    - "traefik.http.services.${COMPOSE_PROJECT_NAME:-motrix-next}-web.loadbalancer.server.port=47000"
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:47000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    interval: 30s
    timeout: 10s
    start_period: 15s
    retries: 3

services:
  motrix-next-arm:
    <<: *motrix-next-base
    profiles: ["arm"]
    image: ${MOTRIX_ARM_IMAGE}
    pull_policy: always
    environment:
      PORT: "47000"
      DOWNLOAD_DIR: /downloads
      VOS_APP_VERSION: "__APP_VERSION__"
      MOTRIX_PROFILE: arm
      MOTRIX_IMAGE: ${MOTRIX_ARM_IMAGE}

  motrix-next-amd:
    <<: *motrix-next-base
    profiles: ["amd"]
    image: ${MOTRIX_AMD_IMAGE}
    pull_policy: always
    environment:
      PORT: "47000"
      DOWNLOAD_DIR: /downloads
      VOS_APP_VERSION: "__APP_VERSION__"
      MOTRIX_PROFILE: amd
      MOTRIX_IMAGE: ${MOTRIX_AMD_IMAGE}

networks:
  vos_default:
    external: true
