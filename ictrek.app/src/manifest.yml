id: com.ictrek.motrix-next
name:
  zh-CN: Motrix Next
  en: Motrix Next
description:
  zh-CN: 面向 VOS 的 Motrix Next 下载管理 Web 应用，提供 aria2 任务管理与下载目录持久化。
  en: Motrix Next download manager for VOS, with aria2 task management and persistent downloads.
version: __APP_VERSION__
author: ictrek
category: [storage]
arch: [amd64, arm64]
icon: icon.png

frontend:
  enabled: true
  basePath: /app/com.ictrek.motrix-next

platform:
  version: ">=3.0.0"

profiles:
  - name: amd
    title:
      zh-CN: AMD64
      en: AMD64
    description:
      zh-CN: x86_64 / AMD64 平台，使用 AMD_with_cuda 发布表中的 Motrix 镜像。
      en: x86_64 / AMD64 platform, using the Motrix image from the AMD_with_cuda sheet.
    conflicts: [arm]
  - name: arm
    title:
      zh-CN: ARM64
      en: ARM64
    description:
      zh-CN: ARM64 平台，使用 ARM_with_cuda 发布表中的 Motrix 镜像。
      en: ARM64 platform, using the Motrix image from the ARM_with_cuda sheet.
    conflicts: [amd]
