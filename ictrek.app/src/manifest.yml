id: com.ictrek.motrix-next
name:
  zh-CN: V-Burst
  en: V-Burst
description:
  zh-CN: 面向 VOS 的 V-Burst 下载管理 Web 应用，提供 aria2 任务管理与下载目录持久化。
  en: V-Burst download manager for VOS, with aria2 task management and persistent downloads.
version: __APP_VERSION__
author: ictrek
category: [download]
arch: [amd64, arm64]
icon: icon.png

frontend:
  enabled: true
  basePath: /app/com.ictrek.motrix-next

platform:
  version: ">=3.0.0"

profiles:
  - name: amd
    title:
      zh-CN: AMD64
      en: AMD64
    description:
      zh-CN: x86_64 / AMD64 平台，使用 AMD_with_cuda 发布表中的 V-Burst 镜像。
      en: x86_64 / AMD64 platform, using the V-Burst image from the AMD_with_cuda sheet.
    caps:
      arch: amd64
    conflicts: [arm]
  - name: arm
    title:
      zh-CN: ARM64
      en: ARM64
    description:
      zh-CN: ARM64 平台，使用 ARM_with_cuda 发布表中的 V-Burst 镜像。
      en: ARM64 platform, using the V-Burst image from the ARM_with_cuda sheet.
    caps:
      arch: arm64
    conflicts: [amd]

require-profiles: true
